[package]
name = "taa-vidyo-yapici"
version = "1.0.1"
edition = "2021"

[dependencies]
ab_glyph = "0.2"
getrandom = "0.4.3"
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = "1"   # TAA ortak giriş (src/taa_giris.rs); taa-hata ile zaten kilit dosyasında
taa-hata = { git = "https://github.com/yusufbesir/taa-paket", rev = "306a0627c5601624851740b2821e53cad34506bf" }

# Gömülü pencere (WebView2) yalnız Windows'ta; varsayılan tarayıcı hiç açılmaz.
[target.'cfg(windows)'.dependencies]
tao = "0.37.2"
wry = "0.57.2"
