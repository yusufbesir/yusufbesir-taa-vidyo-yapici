<!doctype html>
<!-- Açıklama: TAA Vidyo Yapıcı açılış animasyonu, tur 2, konsept "Kalibrasyon". Tek bağımsız dosya. Sahip: Yusuf. Yazan: [Claude#Sonnet-5.5 alt ajan, 2026-11-17]. Yalnız yazan yapay zekâ ya da Yusuf'un izniyle değişir; silme yok. Kurallar: BRIF.md -->
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAA Vidyo Yapıcı - Kalibrasyon</title>
<style>
:root{--v:#9A1B3C;--vl:#D2486A;--vd:#5A0C20;--bg:#191826;--tx:#F1F0EC}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif}
#st{position:absolute;left:0;top:0;width:1600px;height:900px;overflow:hidden;transform-origin:0 0;background:var(--bg)}
#st>*,#ui>*{position:absolute}
#ui,#mg{left:0;top:0;width:1600px;height:900px}
#mg{perspective:1400px}
.br{position:absolute;top:0;height:900px}.br div{width:100%;height:100%;transform-origin:50% 0}
#lg{left:544px;top:98px;width:512px;height:512px;background:var(--v)}
#tt,#tg{left:0;width:1600px;text-align:center}
#tt{top:650px;font-size:68px;font-weight:700;letter-spacing:.5px}
#tg{top:742px;font-size:28px;opacity:.8}
.b{position:fixed;z-index:9;font:600 15px/1 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--tx);background:rgba(25,24,38,.6);border:1px solid rgba(241,240,236,.4);padding:11px 20px;border-radius:999px;cursor:pointer}
.b:hover{background:rgba(241,240,236,.14)}.b:focus-visible{outline:2px solid var(--vl);outline-offset:2px}
#skip{top:20px;right:24px}#rep{bottom:20px;right:24px}
</style></head><body>
<div id="st">
 <div id="mg"></div>
 <div id="lg"></div>
 <div id="tt">TAA Vidyo Yapıcı</div><div id="tg">Yaz, önizle, tek tıkla videoyu yap.</div>
</div>
<button class="b" id="skip">Geç</button><button class="b" id="rep">Tekrar oynat</button>
<script>
const $=s=>document.querySelector(s),E='cubic-bezier(.65,0,.35,1)',EO='cubic-bezier(.2,.7,.2,1)';let L=[];
const A=(e,k,d,t=0,o={})=>{const x=(typeof e=='string'?$(e):e).animate(k,{duration:d*1e3,delay:t*1e3,fill:'both',easing:E,...o});L.push(x);return x};
const fit=()=>{const s=Math.min(innerWidth/1600,innerHeight/900);$('#st').style.transform=`translate(${(innerWidth-1600*s)/2}px,${(innerHeight-900*s)/2}px) scale(${s})`};
// pile geometrisi (128 kutusu)
const PL=[[16,16],[40,16],[56,64],[40,112],[16,112],[32,64]],PR=[[112,16],[88,16],[72,64],[88,112],[112,112],[96,64]];
const poly=a=>a.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join('')+'Z';
const pc=(ox,oy,k)=>"path('"+[PL,PR].map(P=>poly(P.map(p=>[ox+p[0]*k,oy+p[1]*k]))).join('')+"')";
const rc=(...a)=>"path('"+a.map(poly).join('')+"')";
const N=16,W=1600/N,TS=['#E8E6E0','#D8C94A','#4AB0C0','#4AA868','#B054B0','#C84848','#4860C8'],VS=['#D2486A','#9A1B3C','#5A0C20','#9A1B3C'];
const br=[...Array(N)].map((_,i)=>{const d=document.createElement('div');d.className='br';d.style.cssText=`left:${i*W}px;width:${W+.5}px`;d.innerHTML='<div></div>';$('#mg').append(d);return d});
$('#lg').style.clipPath=pc(0,0,4);
function build(){
 const M=1.85,MD=.85,X='cubic-bezier(.7,0,.2,1)';
 br.forEach((d,i)=>{const k=d.firstChild,sg=i%2?1:-1;
  A(k,[{transform:'scaleY(0)',backgroundColor:TS[i%7]},{transform:'none',backgroundColor:TS[i%7]}],.55,.1+i*.035,{easing:EO});
  A(k,[{backgroundColor:TS[i%7]},{backgroundColor:VS[i%4]}],.6,1.15+(i%4)*.05,{fill:'forwards'});
  // şeritler akordeon gibi katlanıp ortaya toplanır
  A(d,[{left:i*W+'px',width:W+.5+'px',transform:'none'},{left:i*W+(544+i*32-i*W)*.5+'px',width:'60px',transform:`rotateY(${sg*64}deg)`,offset:.5},{left:544+i*32+'px',width:'32px',transform:'none'}],MD,M,{easing:X,fill:'forwards'});
 });
 A('#mg',[{clipPath:rc([[-50,-50],[800,-50],[800,450],[800,950],[-50,950],[-50,450]],[[1650,-50],[800,-50],[800,450],[800,950],[1650,950],[1650,450]])},{clipPath:pc(544,98,4)}],MD,M,{easing:X});
 A('#mg',[{opacity:1},{opacity:0}],.3,M+MD+.05);
 A('#lg',[{opacity:0},{opacity:1}],.3,M+MD);
 A('#tt',[{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],.5,2.95,{easing:EO});
 A('#tg',[{opacity:0,transform:'translateY(14px)'},{opacity:.8,transform:'none'}],.5,3.15,{easing:EO});
}
function play(){L.forEach(x=>x.cancel());L=[];build();
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){L.forEach(x=>x.finish());A('#st',[{opacity:0},{opacity:1}],.12,0,{easing:'linear'})}}
$('#skip').onclick=()=>L.forEach(x=>x.finish());$('#rep').onclick=play;
addEventListener('resize',fit);fit();play();
</script></body></html>
