<!doctype html>
<!-- Açıklama: TAA Vidyo Yapıcı açılış animasyonu, tur 2, konsept "Dikiş". Tek bağımsız dosya. Sahip: Yusuf. Yazan: [Claude#Sonnet-5.5 alt ajan, 2026-11-17]. Yalnız yazan yapay zekâ ya da Yusuf'un izniyle değişir; silme yok. Kurallar: BRIF.md -->
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAA Vidyo Yapıcı - Dikiş</title>
<style>
:root{--v:#9A1B3C;--vl:#D2486A;--vd:#5A0C20;--bg:#F1F0EC;--tx:#191826}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif}
#st{position:absolute;left:0;top:0;width:1600px;height:900px;overflow:hidden;transform-origin:0 0;background:var(--bg)}
#st>*,#ui>*{position:absolute}
#lg{left:544px;top:98px;width:512px;height:512px}
#lg svg{width:100%;height:100%;overflow:visible}
#lg path{stroke-linejoin:round}
#tt,#tg{left:0;width:1600px;text-align:center}
#tt{top:650px;font-size:68px;font-weight:700;letter-spacing:.5px}
#tg{top:742px;font-size:28px;opacity:.8}
.b{position:fixed;z-index:9;font:600 15px/1 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--tx);background:rgba(241,240,236,.7);border:1px solid rgba(25,24,38,.35);padding:11px 20px;border-radius:999px;cursor:pointer}
.b:hover{background:rgba(25,24,38,.08)}.b:focus-visible{outline:2px solid var(--vl);outline-offset:2px}
#skip{top:20px;right:24px}#rep{bottom:20px;right:24px}
</style></head><body>
<div id="st">
 <div id="lg"><svg viewBox="0 0 128 128">
  <defs>
   <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D2486A"/><stop offset=".42" stop-color="#9A1B3C"/><stop offset="1" stop-color="#5A0C20"/></linearGradient>
   <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D2486A"/><stop offset=".42" stop-color="#9A1B3C"/><stop offset="1" stop-color="#5A0C20"/></linearGradient>
   <pattern id="wv" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.4" height=".9" fill="#fff" opacity=".1"/></pattern>
   <path id="pl" d="M16 16H40L56 64L40 112H16L32 64Z"/><path id="pr" d="M112 16H88L72 64L88 112H112L96 64Z"/>
   <mask id="mk" maskUnits="userSpaceOnUse" x="-10" y="-10" width="150" height="150"><use href="#pl" class="mp" fill="none" stroke="#fff" stroke-width="6" pathLength="100"/><use href="#pr" class="mp" fill="none" stroke="#fff" stroke-width="6" pathLength="100"/></mask>
   <mask id="fm" maskUnits="userSpaceOnUse" x="-10" y="-10" width="150" height="150"><rect id="fr" x="-10" y="-10" width="150" height="0" fill="#fff"/></mask>
  </defs>
  <g id="fill" mask="url(#fm)"><use href="#pl" fill="url(#g)"/><use href="#pr" fill="url(#g2)"/><use href="#pl" fill="url(#wv)"/><use href="#pr" fill="url(#wv)"/></g>
  <g id="inn" fill="none" stroke="#F1F0EC" stroke-width=".7" stroke-dasharray="2 1.6" opacity=".6"><use href="#pl" transform="translate(36 64) scale(.8) translate(-36 -64)"/><use href="#pr" transform="translate(92 64) scale(.8) translate(-92 -64)"/></g>
  <g mask="url(#mk)" fill="none" stroke="#9A1B3C" stroke-width="1.5" stroke-dasharray="4 2.6"><use href="#pl"/><use href="#pr"/></g>
 </svg></div>
 <div id="tt">TAA Vidyo Yapıcı</div><div id="tg">Yaz, önizle, tek tıkla videoyu yap.</div>
</div>
<button class="b" id="skip">Geç</button><button class="b" id="rep">Tekrar oynat</button>
<script>
const $=s=>document.querySelector(s),E='cubic-bezier(.65,0,.35,1)',EO='cubic-bezier(.2,.7,.2,1)';let L=[];
const A=(e,k,d,t=0,o={})=>{const x=(typeof e=='string'?$(e):e).animate(k,{duration:d*1e3,delay:t*1e3,fill:'both',easing:E,...o});L.push(x);return x};
const fit=()=>{const s=Math.min(innerWidth/1600,innerHeight/900);$('#st').style.transform=`translate(${(innerWidth-1600*s)/2}px,${(innerHeight-900*s)/2}px) scale(${s})`};

function build(){
 // 1) iki pilenin dış hattı dikilir (maske kesik çizgiyi ilerleterek açar)
 document.querySelectorAll('.mp').forEach(m=>A(m,[{strokeDasharray:'100',strokeDashoffset:'100'},{strokeDasharray:'100',strokeDashoffset:'0'}],1.3,.35,{easing:'cubic-bezier(.45,.1,.4,1)'}));
 // 2) kumaş dolgusu yukarıdan aşağı dolar, iç dikiş belirir
 A('#fr',[{height:'0px'},{height:'150px'}],.9,1.55,{easing:E});
 A('#inn',[{opacity:0},{opacity:.6}],.5,2.1);
 // kamera hafifçe yaklaşıp logo yerine oturur
 A('#lg',[{transform:'scale(1.12)'},{transform:'none'}],3.1,0,{easing:'cubic-bezier(.2,.6,.2,1)'});
 A('#tt',[{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],.5,2.7,{easing:EO});
 A('#tg',[{opacity:0,transform:'translateY(14px)'},{opacity:.8,transform:'none'}],.5,2.9,{easing:EO});
}
function play(){L.forEach(x=>x.cancel());L=[];build();
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){L.forEach(x=>x.finish());A('#st',[{opacity:0},{opacity:1}],.12,0,{easing:'linear'})}}
$('#skip').onclick=()=>L.forEach(x=>x.finish());$('#rep').onclick=play;
addEventListener('resize',fit);fit();play();
</script></body></html>
