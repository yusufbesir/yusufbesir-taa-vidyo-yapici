<!doctype html>
<!-- Açıklama: TAA Vidyo Yapıcı açılış animasyonu (tur 2, Opus isik). Logo: logo.js (İkiz Kabartma, tek yer). Sahip: Yusuf. Yazan: [Claude#Sonnet-5.5]. Yalnız yazan yapay zekâ ya da Yusuf'un izniyle değişir; silme yok. --><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sahne Işığı</title>
<style>
html,body{margin:0;height:100%;background:#120F17;overflow:hidden;font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:#F0EEF8}
:root{--S:min(42vh,30vw)}
#logo{position:fixed;left:50%;top:44%;width:var(--S);height:var(--S);transform:translate(-50%,-50%)}
#logo svg{width:100%;height:100%;display:block;overflow:visible}
#yazi{position:fixed;left:0;right:0;top:calc(44% + var(--S)*.58);text-align:center;z-index:2}
.kap{overflow:hidden}
#ad{display:inline-block;font-size:clamp(30px,4.2vw,64px);font-weight:700;letter-spacing:-.01em}
#cumle{display:inline-block;margin-top:.4em;font-size:clamp(16px,1.4vw,22px);color:#B7B2CE}
button{position:fixed;z-index:9;min-height:48px;padding:0 20px;border-radius:999px;border:1px solid #4A4760;background:#232234;color:#F0EEF8;font:inherit;font-size:16px;cursor:pointer}
button:focus-visible{outline:3px solid #D2486A;outline-offset:2px}
#gec{top:20px;right:20px}#tekrar{bottom:20px;right:20px}
#karanlik{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle at var(--x,50%) 44%,transparent 0,transparent calc(var(--S)*.35),rgba(18,15,23,.94) calc(var(--S)*.9))}
#perde2{position:fixed;inset:0;z-index:3;background:#120F17;pointer-events:none}
#zemin{position:fixed;left:50%;top:calc(44% + var(--S)*.47);width:calc(var(--S)*1.6);height:calc(var(--S)*.18);transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(210,72,106,.22),transparent)}
</style><style>html.uyg #tekrar,html.uyg #rep{display:none!important}</style>
<script>/* uygulama modu (?uygulama=1): Tekrar oynat gizli; tıklama/Esc/Geç ana sayfaya bildirilir */if(/[?&]uygulama=1/.test(location.search)){document.documentElement.classList.add("uyg");var g=function(){parent.postMessage("taa-acilis-gec","*")};addEventListener("click",g);addEventListener("keydown",function(e){if(e.key==="Escape")g()})}</script>
</head><body>
<div id="zemin"></div><div id="karanlik" class="gizle"></div><div id="perde2" class="gizle"></div>
<div id="logo"><svg viewBox="0 0 128 128"><g id="ls" data-ikiz="sol"></g><g id="lg" data-ikiz="sag"></g></svg></div>
<div id="yazi"><div class="kap"><span id="ad">TAA Vidyo Yapıcı</span></div><div class="kap"><span id="cumle">Yaz, önizle, tek tıkla videoyu yap.</span></div></div>
<button id="gec" type="button">Geç</button><button id="tekrar" type="button">Tekrar oynat</button>
<script src="logo.js"></script>
<script>
const E={in:"cubic-bezier(0.1,0.9,0.2,1)",up:"cubic-bezier(0.05,0.7,0.1,1)",yumusak:"cubic-bezier(0.65,0,0.35,1)"};
const $=id=>document.getElementById(id);let A=[];
const L="translate(-50%,-50%)";
function metin(d,an){an($("ad"),[{transform:"translateY(105%)"},{transform:"none"}],{duration:550,delay:d,easing:E.up});an($("cumle"),[{transform:"translateY(105%)",opacity:0},{transform:"none",opacity:1}],{duration:550,delay:d+250,easing:E.up})}
function oynat(){
 A.forEach(a=>a.cancel());A=[];const an=(el,kf,o)=>{const a=el.animate(kf,{fill:"both",easing:E.in,...o});A.push(a);return a};
 if(matchMedia("(prefers-reduced-motion: reduce)").matches){document.querySelectorAll(".gizle").forEach(e=>an(e,[{opacity:0},{opacity:0}],{duration:1}));[$("logo"),$("yazi")].forEach(e=>an(e,[{opacity:0},{opacity:1}],{duration:120}));return}

 // Işık lekesi: karanlık katman, deliği soldan sağa kayan bir maskedir; konum için translate kullanılır
 const k=$("karanlik");k.style.width="300vw";k.style.left="-100vw";k.style.setProperty("--x","50%");
 an($("perde2"),[{opacity:1},{opacity:0}],{duration:250});
 an(k,[{transform:"translateX(-45vw)",opacity:1},{transform:"translateX(25vw)",opacity:1,offset:.55},{transform:"translateX(0)",opacity:1,offset:.75},{transform:"translateX(0)",opacity:0}],{duration:2200,easing:E.yumusak});
 an($("logo"),[{transform:L+" scale(.96)"},{transform:L+" scale(1)"}],{duration:2000,easing:E.yumusak});
 an($("zemin"),[{opacity:0},{opacity:0,offset:.5},{opacity:1}],{duration:2200});
 metin(1900,an);
}
$("gec").onclick=()=>A.forEach(a=>a.finish());$("tekrar").onclick=oynat;oynat();
</script></body></html>
