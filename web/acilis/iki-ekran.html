<!doctype html>
<!-- Açıklama: TAA Vidyo Yapıcı açılış animasyonu (tur 2, Opus iki-ekran). Logo: logo.js (İkiz Kabartma, tek yer). Sahip: Yusuf. Yazan: [Claude#Sonnet-5.5]. Yalnız yazan yapay zekâ ya da Yusuf'un izniyle değişir; silme yok. --><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İki Ekran</title>
<style>
html,body{margin:0;height:100%;background:#F1F0EC;overflow:hidden;font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:#1D1B1A}
:root{--S:min(42vh,30vw)}
#logo{position:fixed;left:50%;top:44%;width:var(--S);height:var(--S);transform:translate(-50%,-50%)}
#logo svg{width:100%;height:100%;display:block;overflow:visible}
#yazi{position:fixed;left:0;right:0;top:calc(44% + var(--S)*.58);text-align:center;z-index:2}
.kap{overflow:hidden}
#ad{display:inline-block;font-size:clamp(30px,4.2vw,64px);font-weight:700;letter-spacing:-.01em}
#cumle{display:inline-block;margin-top:.4em;font-size:clamp(16px,1.4vw,22px);color:#5A564F}
button{position:fixed;z-index:9;min-height:48px;padding:0 20px;border-radius:999px;border:1px solid #CFCBC3;background:#FFFFFF;color:#1D1B1A;font:inherit;font-size:16px;cursor:pointer}
button:focus-visible{outline:3px solid #D2486A;outline-offset:2px}
#gec{top:20px;right:20px}#tekrar{bottom:20px;right:20px}
.ekr{position:fixed;top:0;height:100vh;width:50vw;background:linear-gradient(160deg,#B8294D,#7C1430);z-index:3}
#e1{left:0;transform-origin:100% 50%}#e2{right:0;transform-origin:0 50%}
</style><style>html.uyg #tekrar,html.uyg #rep{display:none!important}</style>
<script>/* uygulama modu (?uygulama=1): Tekrar oynat gizli; tıklama/Esc/Geç ana sayfaya bildirilir */if(/[?&]uygulama=1/.test(location.search)){document.documentElement.classList.add("uyg");var g=function(){parent.postMessage("taa-acilis-gec","*")};addEventListener("click",g);addEventListener("keydown",function(e){if(e.key==="Escape")g()})}</script>
</head><body>
<div class="ekr gizle" id="e1"></div><div class="ekr gizle" id="e2"></div>
<div id="logo"><svg viewBox="0 0 128 128"><g id="ls" data-ikiz="sol"></g><g id="lg" data-ikiz="sag"></g></svg></div>
<div id="yazi"><div class="kap"><span id="ad">TAA Vidyo Yapıcı</span></div><div class="kap"><span id="cumle">Yaz, önizle, tek tıkla videoyu yap.</span></div></div>
<button id="gec" type="button">Geç</button><button id="tekrar" type="button">Tekrar oynat</button>
<script src="logo.js"></script>
<script>
const E={in:"cubic-bezier(0.1,0.9,0.2,1)",up:"cubic-bezier(0.05,0.7,0.1,1)",yumusak:"cubic-bezier(0.65,0,0.35,1)"};
const $=id=>document.getElementById(id);let A=[];
const L="translate(-50%,-50%)";
function metin(d,an){an($("ad"),[{transform:"translateY(105%)"},{transform:"none"}],{duration:550,delay:d,easing:E.up});an($("cumle"),[{transform:"translateY(105%)",opacity:0},{transform:"none",opacity:1}],{duration:550,delay:d+250,easing:E.up})}
function oynat(){
 A.forEach(a=>a.cancel());A=[];const an=(el,kf,o)=>{const a=el.animate(kf,{fill:"both",easing:E.in,...o});A.push(a);return a};
 if(matchMedia("(prefers-reduced-motion: reduce)").matches){document.querySelectorAll(".gizle").forEach(e=>an(e,[{opacity:0},{opacity:0}],{duration:1}));[$("logo"),$("yazi")].forEach(e=>an(e,[{opacity:0},{opacity:1}],{duration:120}));return}

 // Ekran ölçüsü: pile kutusu (S*0.19 genişlik, S*0.75 yükseklik), merkezden S*0.31 uzak
 const S=Math.min(innerHeight*.42,innerWidth*.3),W=innerWidth,H=innerHeight,cy=H*.44;
 const sx=(S*.24)/(W/2),sy=(S*.75)/H,ty=cy-H/2,dx=S*.04;
 an($("e1"),[{transform:"none"},{transform:"translateX(-6px)",offset:.25},{transform:`translate(${-dx}px,${ty}px) scale(${sx},${sy})`,offset:.85},{transform:`translate(${-dx}px,${ty}px) scale(${sx},${sy})`,opacity:1},{opacity:0,transform:`translate(${-dx}px,${ty}px) scale(${sx},${sy})`}],{duration:1500,easing:E.yumusak});
 an($("e2"),[{transform:"none"},{transform:"translateX(6px)",offset:.25},{transform:`translate(${dx}px,${ty}px) scale(${sx},${sy})`,offset:.85},{transform:`translate(${dx}px,${ty}px) scale(${sx},${sy})`,opacity:1},{opacity:0,transform:`translate(${dx}px,${ty}px) scale(${sx},${sy})`}],{duration:1500,easing:E.yumusak});
 $("ls").style.transformBox=$("lg").style.transformBox="view-box";$("ls").style.transformOrigin="36px 64px";$("lg").style.transformOrigin="92px 64px";
 an($("ls"),[{transform:"perspective(300px) rotateY(80deg)",opacity:0},{transform:"none",opacity:1}],{duration:600,delay:1250});
 an($("lg"),[{transform:"perspective(300px) rotateY(-80deg)",opacity:0},{transform:"none",opacity:1}],{duration:600,delay:1250});
 metin(1750,an);
}
$("gec").onclick=()=>A.forEach(a=>a.finish());$("tekrar").onclick=oynat;oynat();
</script></body></html>
