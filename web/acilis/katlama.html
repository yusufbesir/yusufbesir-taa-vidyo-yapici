<!doctype html>
<!-- Açıklama: TAA Vidyo Yapıcı açılış animasyonu, tur 2, konsept "Katlama". Tek bağımsız dosya. Sahip: Yusuf. Yazan: [Claude#Sonnet-5.5 alt ajan, 2026-11-17]. Yalnız yazan yapay zekâ ya da Yusuf'un izniyle değişir; silme yok. Kurallar: BRIF.md -->
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAA Vidyo Yapıcı - Katlama</title>
<style>
:root{--v:#9A1B3C;--vl:#D2486A;--vd:#5A0C20;--bg:#F1F0EC;--tx:#191826}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif}
#st{position:absolute;left:0;top:0;width:1600px;height:900px;overflow:hidden;transform-origin:0 0;background:var(--bg)}
#st>*,#ui>*{position:absolute}
#wr,#fold{position:absolute;left:0;top:0;width:1600px;height:900px}
#fold{perspective:1800px;perspective-origin:50% 50%}
.pn{position:absolute;top:0;height:900px;width:534px;transform-style:preserve-3d}
.pn i{position:absolute;inset:0;backface-visibility:hidden;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 2px,transparent 2px 7px),linear-gradient(90deg,#8A1735,#9A1B3C 40%,#A92246 60%,#9A1B3C)}
.pn i+i{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,rgba(0,0,0,.08) 0 2px,transparent 2px 7px),#9A1B3C}
#p1 i+i{background:#7E1631}
#p1{left:0;transform-origin:100% 50%}#p2{left:533px}#p3{left:1067px;transform-origin:0 50%}
#p2 i{border-left:2px solid rgba(90,12,32,.5);border-right:2px solid rgba(90,12,32,.5)}
#lg{left:544px;top:98px;width:512px;height:512px;background:var(--v)}
#lk{left:544px;top:98px;width:512px;height:512px;overflow:visible}
#tt,#tg{left:0;width:1600px;text-align:center}
#tt{top:650px;font-size:68px;font-weight:700;letter-spacing:.5px}
#tg{top:742px;font-size:28px;opacity:.8}
.b{position:fixed;z-index:9;font:600 15px/1 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--tx);background:rgba(241,240,236,.7);border:1px solid rgba(25,24,38,.35);padding:11px 20px;border-radius:999px;cursor:pointer}
.b:hover{background:rgba(25,24,38,.08)}.b:focus-visible{outline:2px solid var(--vl);outline-offset:2px}
#skip{top:20px;right:24px}#rep{bottom:20px;right:24px}
</style><style>html.uyg #tekrar,html.uyg #rep{display:none!important}</style>
<script>/* uygulama modu (?uygulama=1): Tekrar oynat gizli; tıklama/Esc/Geç ana sayfaya bildirilir */if(/[?&]uygulama=1/.test(location.search)){document.documentElement.classList.add("uyg");var g=function(){parent.postMessage("taa-acilis-gec","*")};addEventListener("click",g);addEventListener("keydown",function(e){if(e.key==="Escape")g()})}</script>
</head><body>
<div id="st">
 <div id="wr"><div id="fold"><div class="pn" id="p1"><i></i><i></i></div><div class="pn" id="p2"><i></i><i></i></div><div class="pn" id="p3"><i></i><i></i></div></div></div>
 <div id="lg"></div>
 <svg id="lk" viewBox="0 0 128 128" aria-hidden="true"><g data-ikiz="sol"></g><g data-ikiz="sag"></g></svg>
 <div id="tt">TAA Vidyo Yapıcı</div><div id="tg">Yaz, önizle, tek tıkla videoyu yap.</div>
</div>
<button class="b" id="skip">Geç</button><button class="b" id="rep">Tekrar oynat</button>
<script src="logo.js"></script>
<script>
const $=s=>document.querySelector(s),E='cubic-bezier(.65,0,.35,1)',EO='cubic-bezier(.2,.7,.2,1)';let L=[];
const A=(e,k,d,t=0,o={})=>{const x=(typeof e=='string'?$(e):e).animate(k,{duration:d*1e3,delay:t*1e3,fill:'both',easing:E,...o});L.push(x);return x};
const fit=()=>{const s=Math.min(innerWidth/1600,innerHeight/900);$('#st').style.transform=`translate(${(innerWidth-1600*s)/2}px,${(innerHeight-900*s)/2}px) scale(${s})`};
// pile geometrisi (128 kutusu)
const PL=[[16,16],[40,16],[56,64],[40,112],[16,112],[32,64]],PR=[[112,16],[88,16],[72,64],[88,112],[112,112],[96,64]];
const poly=a=>a.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join('')+'Z';
const pc=(ox,oy,k)=>"path('"+[PL,PR].map(P=>poly(P.map(p=>[ox+p[0]*k,oy+p[1]*k]))).join('')+"')";
const rc=(...a)=>"path('"+a.map(poly).join('')+"')";
$('#lg').style.clipPath=pc(0,0,4);
function build(){
 const X='cubic-bezier(.5,0,.2,1)',M=2.2,MD=.7;
 A('#wr',[{transform:'translateY(100%)'},{transform:'none'}],.7,0,{easing:EO});
 // üç parçalı şerit iki kat: yan parçalar ortadakinin üstüne kapanır
 A('#p1',[{transform:'translateZ(2px) rotateY(0)'},{transform:'translateZ(2px) rotateY(180deg)'}],.85,.95,{easing:X});
 A('#p3',[{transform:'translateZ(4px) rotateY(0)'},{transform:'translateZ(4px) rotateY(-180deg)'}],.85,1.3,{easing:X});
 const big=rc([[-400,-400],[800,-400],[800,450],[800,1300],[-400,1300],[-400,450]],[[2000,-400],[800,-400],[800,450],[800,1300],[2000,1300],[2000,450]]);
 const st=rc([[533,0],[800,0],[800,450],[800,900],[533,900],[533,450]],[[1067,0],[800,0],[800,450],[800,900],[1067,900],[1067,450]]);
 A('#fold',[{clipPath:big,offset:0},{clipPath:big,offset:.73},{clipPath:st,offset:.76,easing:X},{clipPath:pc(544,98,4)}],M+MD-.0,0,{easing:'linear',duration:(M+MD)*1e3});
 A('#wr',[{opacity:1},{opacity:0}],.25,M+MD+.05);
 A('#lg',[{opacity:0},{opacity:1}],.25,M+MD);
 A('#lk',[{opacity:0},{opacity:1}],.25,M+MD);
 A('#tt',[{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],.5,2.95,{easing:EO});
 A('#tg',[{opacity:0,transform:'translateY(14px)'},{opacity:.8,transform:'none'}],.5,3.15,{easing:EO});
}
function play(){L.forEach(x=>x.cancel());L=[];build();
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){L.forEach(x=>x.finish());A('#st',[{opacity:0},{opacity:1}],.12,0,{easing:'linear'})}}
$('#skip').onclick=()=>L.forEach(x=>x.finish());$('#rep').onclick=play;
addEventListener('resize',fit);fit();play();
</script></body></html>
