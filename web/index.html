<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED Ekran Video</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
:root{--bg:#0e1015;--panel:#161922;--kenar:#262b38;--yazi:#e8e6df;--soluk:#9aa0ad;--altin:#ffce30;--altin2:#7f6718;--hata:#ff7a6b;--ok:#7bd88f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--yazi);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--kenar)}
header img{height:44px}
header h1{font-size:20px;margin:0;color:var(--altin);letter-spacing:.5px}
header .sur{color:var(--soluk);font-size:13px}
header .bos{flex:1}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;padding:18px 20px;max-width:1200px;margin:0 auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--kenar);border-radius:10px;padding:14px}
h2{font-size:14px;margin:0 0 10px;color:var(--soluk);text-transform:uppercase;letter-spacing:1px;font-weight:600}
textarea{width:100%;height:340px;background:#0b0d12;color:#f3efe2;border:1px solid var(--kenar);border-radius:8px;padding:10px;font:13px/1.5 Consolas,monospace;resize:vertical}
label{display:block;font-size:13px;color:var(--soluk);margin:8px 0 3px}
input,select{background:#0b0d12;color:var(--yazi);border:1px solid var(--kenar);border-radius:6px;padding:7px 9px;font:inherit;max-width:100%}
button{background:var(--altin);color:#1b1500;border:0;border-radius:7px;padding:8px 16px;font:600 14px inherit;cursor:pointer}
button.ikinci{background:#262b38;color:var(--yazi)}
button:disabled{opacity:.5;cursor:default}
.satir{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.izgara{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px 10px}
.onizle{background:#000;border:1px solid var(--kenar);border-radius:8px;width:100%;aspect-ratio:9/16;object-fit:contain;display:block}
#hata{color:var(--hata);min-height:1.4em;font-size:13px;margin-top:6px;white-space:pre-wrap}
.cubuk{height:10px;background:#0b0d12;border-radius:6px;overflow:hidden;border:1px solid var(--kenar);margin-top:10px}
.cubuk i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--altin2),var(--altin))}
.sonuc{margin-top:8px;font-size:13px}
.sonuc.ok{color:var(--ok)}.sonuc.hata{color:var(--hata)}
details{margin-top:12px;border-top:1px solid var(--kenar);padding-top:10px}
summary{cursor:pointer;color:var(--altin);font-weight:600}
.alt{grid-column:1/-1}
.not{color:var(--soluk);font-size:12.5px;margin-top:8px}
#ff{font-size:12.5px}.ffyok{color:var(--hata)}.ffvar{color:var(--ok)}
</style>
</head>
<body>
<header>
  <img src="/logo.svg" alt="">
  <div><h1>LED Ekran Video</h1><div class="sur" id="sur"></div></div>
  <div class="bos"></div>
  <div id="ff"></div>
  <button class="ikinci" id="kapat" title="Programı kapat">Kapat</button>
</header>
<main>
  <section>
    <h2>Senaryo</h2>
    <div class="satir">
      <select id="ornek"><option value="">Örnek senaryo seç…</option></select>
      <button class="ikinci" id="yukle">Yükle</button>
    </div>
    <label for="metin">Senaryo metni (satır başı # yorumdur)</label>
    <textarea id="metin" spellcheck="false"></textarea>
    <details>
      <summary>Sahne ekle (forma göre satır yazar)</summary>
      <label for="s_metin">Yazı (| satır böler, * ile başlayan satır büyük rakam, @cicek gibi çizim)</label>
      <input id="s_metin" style="width:100%" value="PEŞİN|FİYATINA|*3|TAKSİT">
      <div class="izgara">
        <div><label>Renk</label><select id="s_renk"></select></div>
        <div><label>Giriş</label><select id="s_giris"></select></div>
        <div><label>Çıkış</label><select id="s_cikis"></select></div>
        <div><label>Süre (sn)</label><input id="s_sure" type="number" min="1.5" step="0.5" value="6" style="width:90px"></div>
      </div>
      <label>Efektler</label>
      <div class="satir" id="s_efekt"></div>
      <div style="margin-top:10px"><button id="ekle">Sahneyi ekle</button> <button class="ikinci" id="oynat">Seçili giriş ve çıkışı oynat</button> <span id="sayi" class="not"></span></div>
      <p class="not">Yeni animasyon eklemek için şu klasörlerden birine anahtar kareli .txt dosyası koyun (★ ile görünür): <span id="ozelklasor"></span></p>
    </details>
    <p class="not">Ekran ölçüsü, geçişler ve sahneler bu metinle belirlenir. Ayrıntı için README dosyasına bakın.</p>
  </section>
  <section>
    <h2>Önizleme</h2>
    <img class="onizle" id="resim" alt="önizleme">
    <label for="t">Zaman: <span id="tsn">1.0</span> sn / <span id="top">–</span> sn</label>
    <input type="range" id="t" min="0" max="10" step="0.1" value="1" style="width:100%">
    <div id="hata"></div>
  </section>
  <section class="alt">
    <h2>Video üret</h2>
    <div class="satir">
      <div><label for="dosya">Dosya adı</label><input id="dosya" value="kampanya" style="width:220px"></div>
      <div><label for="kodek">Biçim</label><select id="kodek"><option value="mp4">MP4 (H.264)</option><option value="hap">HAP (MOV)</option></select></div>
      <div style="align-self:end"><button id="uret">Video üret</button> <button class="ikinci" id="iptal" disabled>İptal</button> <button class="ikinci" id="klasor">Klasörü aç</button></div>
    </div>
    <div class="cubuk"><i id="cub"></i></div>
    <div class="sonuc" id="sonuc"></div>
    <p class="not" id="klas"></p>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const H={'X-LED':'1'};
const RENK={altin:'Altın',sari:'Sarı',beyaz:'Beyaz (kısık)',turuncu:'Turuncu',cyan:'Cyan',magenta:'Magenta',lime:'Lime'};
function doldur(id,liste,sec){const s=$(id);s.innerHTML='';liste.forEach(v=>{const o=document.createElement('option');o.value=v.ad;o.textContent=v.ad+(v.ozel?' ★':'')+' — '+v.acik;s.appendChild(o)});if(sec)s.value=sec}
const rs=$('s_renk');Object.entries(RENK).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v;rs.appendChild(o)});rs.value='altin';
function efektDoldur(liste){const k=$('s_efekt');k.innerHTML='';liste.forEach(e=>{const l=document.createElement('label');l.style.cssText='display:inline-flex;gap:5px;margin:0;align-items:center';l.title=e.acik;l.innerHTML='<input type="checkbox" value="'+e.ad+'"'+(e.ad==='parlama'?' checked':'')+'> '+e.ad;k.appendChild(l)})}
let toplam=10,bekle=null,istek=0;
function kaydet(){try{localStorage.setItem('led_metin',$('metin').value)}catch(e){}}
async function bilgi(){
  const b=await (await fetch('/bilgi')).json();
  $('sur').textContent='Sürüm '+b.surum;
  $('ff').innerHTML=b.ffmpeg?'<span class="ffvar">ffmpeg hazır</span>':'<span class="ffyok">ffmpeg bulunamadı</span>';
  $('ff').title=b.ffmpeg||'ffmpeg.exe dosyasını programın klasörüne veya D:\\Programlar\\Araçlar Ve İndirilenler altına koyun';
  $('klas').textContent='Videolar şu klasöre yazılır: '+b.klasor;
  doldur('s_giris',b.girisler,'toplan');doldur('s_cikis',b.cikislar,'dagil');efektDoldur(b.efektler);
  $('ozelklasor').textContent=b.animasyon_klasorleri.join('  |  ');
  $('sayi').textContent=b.girisler.length+' giriş, '+b.cikislar.length+' çıkış, '+b.efektler.length+' efekt';
  b.ornekler.forEach(a=>{const o=document.createElement('option');o.value=a;o.textContent=a;$('ornek').appendChild(o)});
  let kayit='';try{kayit=localStorage.getItem('led_metin')||''}catch(e){}
  if(kayit){$('metin').value=kayit}else{await ornekYukle('tv-afis')}
  onizle();
}
async function ornekYukle(ad){if(!ad)return;$('metin').value=await (await fetch('/ornek/'+encodeURIComponent(ad))).text();kaydet();onizle()}
async function onizle(){
  const n=++istek;$('hata').textContent='';
  const r=await fetch('/onizle?t='+$('t').value,{method:'POST',headers:H,body:$('metin').value});
  if(n!==istek)return;
  if(!r.ok){$('hata').textContent=await r.text();return}
  const top=parseFloat(r.headers.get('X-Toplam'));if(top){toplam=top;$('top').textContent=top.toFixed(1);$('t').max=Math.max(0.1,top-0.04).toFixed(2)}
  const u=URL.createObjectURL(await r.blob());const eski=$('resim').src;$('resim').src=u;if(eski.startsWith('blob:'))URL.revokeObjectURL(eski);
}
function ertele(){clearTimeout(bekle);bekle=setTimeout(onizle,500)}
$('metin').addEventListener('input',()=>{kaydet();ertele()});
$('t').addEventListener('input',()=>{$('tsn').textContent=parseFloat($('t').value).toFixed(1);ertele()});
$('yukle').onclick=()=>ornekYukle($('ornek').value);
$('ekle').onclick=()=>{
  const ef=[...document.querySelectorAll('#s_efekt input:checked')].map(c=>c.value).join(',')||'yok';
  const m=$('s_metin').value.replace(/"/g,'');
  const satir='sahne "'+m+'" renk='+$('s_renk').value+' giris='+$('s_giris').value+' cikis='+$('s_cikis').value+' sure='+$('s_sure').value+' efekt='+ef;
  const t=$('metin');t.value=t.value.replace(/\s*$/,'')+'\n'+satir+'\n';kaydet();onizle();
};
$('oynat').onclick=async()=>{
  const ef=[...document.querySelectorAll('#s_efekt input:checked')].map(c=>c.value).join(',')||'yok';
  const m=$('s_metin').value.replace(/"/g,'');
  const sen='ekran 490x900\nfiziksel 8x25\nfps 25\nsahne "'+m+'" renk='+$('s_renk').value+' giris='+$('s_giris').value+' cikis='+$('s_cikis').value+' sure=4 efekt='+ef+'\n';
  $('oynat').disabled=true;$('hata').textContent='';
  const turlar=[...Array(9).keys()].map(i=>i*0.2).concat([...Array(8).keys()].map(i=>2.6+i*0.15));
  for(const t of turlar){
    const r=await fetch('/onizle?t='+t.toFixed(2),{method:'POST',headers:H,body:sen});
    if(!r.ok){$('hata').textContent=await r.text();break}
    const u=URL.createObjectURL(await r.blob());const eski=$('resim').src;$('resim').src=u;if(eski.startsWith('blob:'))URL.revokeObjectURL(eski);
  }
  $('oynat').disabled=false;
};
$('uret').onclick=async()=>{
  $('sonuc').className='sonuc';$('sonuc').textContent='';
  const r=await fetch('/uret?kodek='+$('kodek').value+'&dosya='+encodeURIComponent($('dosya').value),{method:'POST',headers:H,body:$('metin').value});
  if(!r.ok){$('sonuc').className='sonuc hata';$('sonuc').textContent=await r.text();return}
  izle();
};
$('iptal').onclick=()=>fetch('/iptal',{method:'POST',headers:H});
$('klasor').onclick=()=>fetch('/klasor',{method:'POST',headers:H});
$('kapat').onclick=async()=>{if(confirm('Program kapatılsın mı?')){try{await fetch('/kapat',{method:'POST',headers:H})}catch(e){}document.body.innerHTML='<p style="padding:30px">Program kapatıldı. Bu sekmeyi kapatabilirsiniz.</p>'}};
let izliyor=false;
async function izle(){
  if(izliyor)return;izliyor=true;
  for(;;){
    const d=await (await fetch('/durum')).json();
    $('uret').disabled=d.calisiyor;$('iptal').disabled=!d.calisiyor;
    const y=d.toplam?Math.round(100*d.kare/d.toplam):0;$('cub').style.width=y+'%';
    if(d.calisiyor){$('sonuc').className='sonuc';$('sonuc').textContent='Üretiliyor: %'+y+' ('+d.kare+'/'+d.toplam+' kare)'}
    else{if(d.dosya){$('sonuc').className='sonuc '+(d.hata?'hata':'ok');$('sonuc').textContent=d.hata?('Hata: '+d.mesaj):('Hazır: '+d.dosya+' ('+d.mesaj+')')}break}
    await new Promise(r=>setTimeout(r,700));
  }
  izliyor=false;
}
setInterval(()=>fetch('/nabiz',{method:'POST',headers:H}).catch(()=>{}),10000);
fetch('/nabiz',{method:'POST',headers:H});
bilgi().then(izle);
</script>
</body>
</html>
